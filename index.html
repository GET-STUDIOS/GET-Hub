<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GET - Ready Together</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#D4AF37',     // Accent gold
              goldLight: '#F3E5AB',// Hover gold
              brownDark: '#2C1A0E',// Deep brown
              brownCard: '#3A2415',// Card background brown
              black: '#121212'     // Dark background
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-black text-amber-100 min-h-screen font-sans flex flex-col">

  <header class="border-b border-brand-gold/20 bg-brand-brownDark/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="bg-brand-gold text-brand-black font-black px-2.5 py-1 rounded text-lg tracking-wider">GET</span>
        <h1 class="text-xl font-bold tracking-tight text-brand-gold">Ready Together</h1>
      </div>
      <button id="logout-btn" class="hidden text-sm bg-brand-brownCard hover:bg-brand-brownDark text-brand-gold border border-brand-gold/30 font-medium py-1.5 px-4 rounded-lg transition">
        Sign Out
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">

    <div id="auth-container" class="max-w-md mx-auto my-8 bg-brand-brownCard border border-brand-gold/30 p-8 rounded-2xl shadow-2xl">
      
      <div class="flex justify-center mb-6">
        <img 
          src="./Logo.png.png" 
          alt="GET Logo" 
          class="h-32 object-contain drop-shadow-md"
        />
      </div>

      <p class="text-amber-200/70 text-sm text-center mb-6">Sign in to access the GET portal.</p>
      
      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-amber-100 mb-1">Email</label>
          <input type="email" id="email" required placeholder="member@example.com" class="w-full bg-brand-black border border-brand-gold/40 rounded-lg px-4 py-2.5 text-amber-100 placeholder-amber-200/30 focus:outline-none focus:border-brand-gold" />
        </div>
        <div>
          <label class="block text-sm font-medium text-amber-100 mb-1">Password</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full bg-brand-black border border-brand-gold/40 rounded-lg px-4 py-2.5 text-amber-100 placeholder-amber-200/30 focus:outline-none focus:border-brand-gold" />
        </div>
        
        <button type="submit" id="auth-submit-btn" class="w-full bg-brand-gold hover:bg-brand-goldLight text-brand-black font-bold py-2.5 rounded-lg transition mt-2 shadow-lg">
          Sign In
        </button>
      </form>
      
      <p id="auth-error" class="text-red-400 text-xs text-center mt-4 hidden"></p>
    </div>

    <div id="app-container" class="hidden space-y-6">
      
      <div class="bg-brand-brownCard border border-brand-gold/30 p-6 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div class="flex items-center space-x-4">
          <div class="w-12 h-12 rounded-full bg-brand-gold/20 border border-brand-gold/50 flex items-center justify-center font-bold text-brand-gold text-lg">
            <span id="user-avatar">?</span>
          </div>
          <div>
            <h2 class="text-xl font-bold text-brand-gold">Explorer Portal</h2>
            <p id="user-display" class="text-xs text-amber-200/70">Logged in as: </p>
          </div>
        </div>

        <div class="flex bg-brand-black/60 p-1 rounded-xl border border-brand-gold/20 text-xs w-full md:w-auto">
          <button id="tab-feed-btn" onclick="switchTab('feed')" class="flex-1 md:flex-none px-4 py-2 rounded-lg font-semibold bg-brand-gold text-brand-black transition">
            Log Feed
          </button>
          <button id="tab-resources-btn" onclick="switchTab('resources')" class="flex-1 md:flex-none px-4 py-2 rounded-lg font-semibold text-amber-200/70 hover:text-brand-gold transition">
            Resources
          </button>
        </div>
      </div>

      <div id="view-feed" class="space-y-6">
        <section class="bg-brand-brownCard border border-brand-gold/30 p-6 rounded-2xl shadow-lg">
          <h3 class="text-lg font-bold text-brand-gold mb-3 flex items-center gap-2">
            <span>✍️</span> Share an Explorer Log
          </h3>
          <textarea id="post-content" rows="3" placeholder="What's the latest update, GET team?" class="w-full bg-brand-black border border-brand-gold/40 rounded-lg p-3 text-amber-100 placeholder-amber-200/30 focus:outline-none focus:border-brand-gold resize-none"></textarea>
          <div class="flex justify-end items-center mt-3">
            <button id="post-btn" class="bg-brand-gold hover:bg-brand-goldLight text-brand-black font-semibold px-5 py-2 rounded-lg text-sm transition shadow-md">
              Post Log
            </button>
          </div>
        </section>

        <section>
          <h3 class="text-lg font-bold text-brand-gold mb-4 flex items-center gap-2">
            <span>📜</span> Expedition Feed
          </h3>
          <div id="posts-feed" class="space-y-4">
            <p class="text-amber-200/50 text-center py-8">Loading logs...</p>
          </div>
        </section>
      </div>

      <div id="view-resources" class="hidden space-y-6">
        <section class="bg-brand-brownCard border border-brand-gold/
